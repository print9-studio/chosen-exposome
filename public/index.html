<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Know Your Exposome</title><meta name="robots" content="noindex"><style>html,body{margin:0;height:100%;background:#2A0C12;color:#EDD6C2;font-family:"Helvetica Neue",Arial,sans-serif}

</style></head><body><div class="wrap"><div class="card"><svg viewBox="0 0 64 100" style="width:34px;height:54px" aria-label="LIFEATBRIDGE mark"><rect x="4" y="4" width="9" height="92" fill="#EDD6C2"/><path d="M13 7 Q60 7 60 29 Q60 50 13 50" fill="none" stroke="#EDD6C2" stroke-width="6"/><path d="M13 50 Q60 50 60 71 Q60 93 13 93" fill="none" stroke="#EDD6C2" stroke-width="6"/></svg><h1>Know Your Exposome</h1><p class="sub">CHOSEN by Dermatology · LIFEATBRIDGE EVENTS</p><div id="box"><form id="f" autocomplete="off"><input id="pw" type="password" placeholder="Password" aria-label="Password"><div class="err" id="err"></div><button type="submit">Enter</button></form></div></div></div><script>var ENC={"salt":"hCW8xR5Or/191CzDcJT86Q==","iv":"l6bcUj8QzfaKmHOO","ct":"Lt3v+8yp5Fec9hlD6rP42Aces3Wc7dbYU0d9WDL4Woq/WwxVDXqTrrfyl0NDIqJNJ+9tgpNzeIwCB4bemYtptKuSfoa4jswvcoKCefvxnv7ETmPKQUl6UJsAR29Jh99wtK6S20ptHcMF9yKMRkBTJNUSyvCLmWeUPS1rKuqBmjj4Ak2PKlD5Xr7glrxk3/j4LBvpQf0+6TT3hCxqaDRUDDtUgnlK5yBfGqKfZKmyLtzpQb68CznHPeEXdfZQVLANu7/bFn/KBA4ymRsSXezlzJUlxipjXzh1FUn6DfRFEu9bxlWNjVyMv7uMBVoG513K7zi1AlZcrbX0ygkXbCXkRcdCYPAlK2c9OJ07OcHqGBkFZ+UXiO31na6VXuEqpj3z66JpUA=="};function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function unlock(pw){var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.salt),iterations:200000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.iv)},key,b64(ENC.ct)));}
async function go(pw,quiet){try{var t=await unlock(pw);try{sessionStorage.setItem('kye',pw)}catch(e){};onOpen(t);}catch(e){if(!quiet){document.getElementById('err').textContent='That password is not right.';}}}
document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();go(document.getElementById('pw').value.trim());});
var s=null;try{s=sessionStorage.getItem('kye')}catch(e){};if(s)go(s,true);;function onOpen(t){document.getElementById('box').innerHTML=JSON.parse(t).menu;}</script></body></html>
