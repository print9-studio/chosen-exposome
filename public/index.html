</style></head><body><div class="wrap"><div class="card"><svg viewBox="0 0 64 100" style="width:34px;height:54px" aria-label="LIFEATBRIDGE mark"><rect x="4" y="4" width="9" height="92" fill="#EDD6C2"/><path d="M13 7 Q60 7 60 29 Q60 50 13 50" fill="none" stroke="#EDD6C2" stroke-width="6"/><path d="M13 50 Q60 50 60 71 Q60 93 13 93" fill="none" stroke="#EDD6C2" stroke-width="6"/></svg><h1>Know Your Exposome</h1><p class="sub">CHOSEN by Dermatology · LIFEATBRIDGE EVENTS</p><div id="box"><form id="f" autocomplete="off"><input id="pw" type="password" placeholder="Password" aria-label="Password"><div class="err" id="err"></div><button type="submit">Enter</button></form></div></div></div><script>var ENC={"salt":"B5TUTZb7X2YYUVDF1XeZ1g==","iv":"+/eUTorugQJL6auN","ct":"FzMDo5cCGiBkOpM1XH+V9De2Lf0gxrnaGOA2Cze7KpNoA1UWmyBiD9MuFdgDJGOChE/Gy8ZtjK9ybFlAIroDiGt2jAxhboQTn6v2FzD30caY0Cg8uKDsaivEjgWN3TGaWujdM6jH62vlrevFswE2c8fBpJ7XSkNjDO+sToexmOdOU/BUFVdSGH8OfFnkM0BA/f+nHBciYNFjRJB3BRXQj1P7YVpBEA08D3xQ0jGyxF8LUFMsQguvQW+xLUvxNIQQEGZOFs3/R0F8M33rg7Mw8QSXOUx7TuleWog3ZRL0URL80+eCNLhCxDVMcacpqDl/+URKRegvnJvs0L71dGWfOriaMObV6bo9K3dmHowgWKPLLQHk3OqaePzQp8mJP8f3Kw/meA=="};function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function unlock(pw){var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.salt),iterations:200000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.iv)},key,b64(ENC.ct)));}
async function go(pw,quiet){try{var t=await unlock(pw);try{sessionStorage.setItem('kye',pw)}catch(e){};onOpen(t);}catch(e){if(!quiet){document.getElementById('err').textContent='That password is not right.';}}}
document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();go(document.getElementById('pw').value.trim());});
var s=null;try{s=sessionStorage.getItem('kye')}catch(e){};if(s)go(s,true);;function onOpen(t){document.getElementById('box').innerHTML=JSON.parse(t).menu;}</script></body></html>
