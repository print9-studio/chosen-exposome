<title>Know Your Exposome – Activation Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--maroon:#4A141C;--cream:#F7F0E8;--rose:#C98A8F;--red:#C8102E}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#2B0A0F;overflow:hidden;font-family:'DM Sans',Arial,sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#deck{position:relative;width:1920px;height:1080px;transform-origin:center center;flex:none}
#deck section{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;opacity:0;visibility:hidden;transition:opacity .45s ease;box-sizing:border-box}
#deck section.active{opacity:1;visibility:visible}
#deck section h1,#deck section h2,#deck section h3,#deck section p,#deck section ul,#deck section ol{margin:0}
#deck section ul{padding-left:1.1em}
#deck section li{margin:.15em 0}
#deck section img{display:block}
#deck section table{border-collapse:collapse;width:100%;overflow:hidden}
#deck section th,#deck section td{padding:.35em .6em;border-bottom:1px solid #E4D6CC;vertical-align:top}
#deck section tr:last-child td{border-bottom:none}
#deck section hr{border:none;margin:0}
#deck section b{font-weight:600}


#gate{position:fixed;inset:0;background:#4A141C;display:flex;align-items:center;justify-content:center;z-index:10}
#gate form{width:min(440px,90vw);display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center}
#gate .mark{display:flex;align-items:center;gap:16px;margin-bottom:10px}
#gate .mark p{margin:0;color:#EDD6C2}
#gate h1{margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:34px;color:#EDD6C2;letter-spacing:1px}
#gate p.sub{margin:0;color:#C98A8F;font-size:14px;letter-spacing:3px;text-transform:uppercase}
#gate input{width:100%;padding:14px 16px;font-size:18px;border-radius:10px;border:1px solid #7A3A42;background:#2A0C12;color:#EDD6C2;text-align:center;letter-spacing:2px;outline:none}
#gate input:focus{border-color:#C98A8F}
#gate button{padding:12px 28px;font-size:15px;letter-spacing:2px;text-transform:uppercase;border-radius:10px;border:none;background:#EDD6C2;color:#4A141C;font-weight:600;cursor:pointer}
#gate .err{color:#FF9AA6;font-size:14px;min-height:18px}
#gate.shake form{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
body:not(.open) #stage,body:not(.open) #bar,body:not(.open) #hud,body:not(.open) #hint,body:not(.open) .tap{display:none}


/* phone portrait: reflow slides into one scrolling column */
@media (max-width:820px) and (orientation:portrait){
  html,body{overflow:auto;height:auto;background:#2B0A0F}
  #stage{position:static;display:block}
  #deck{width:auto;height:auto;transform:none!important}
  #deck section{position:relative;width:720px;height:auto;min-height:0;opacity:1;visibility:visible;padding:44px 32px 36px!important;gap:18px!important;display:flex;flex-direction:column;border-bottom:6px solid #2B0A0F}
  #deck section [style*="position:absolute"]:not([data-map] *){position:static!important;width:auto!important;height:auto!important}
  #deck section [data-map]{zoom:.62;height:470px!important}
  #deck section [data-stack]{flex-direction:column!important;gap:18px!important}
  #deck section svg[data-scene]{width:100%!important;height:auto!important}
  #deck section:has(svg[data-scene]){padding:56px 16px 40px!important}
  #deck section > svg[style*="width:36px"][style*="position:absolute"]:not([data-scene]){position:absolute!important;right:16px!important;bottom:16px!important;width:28px!important;height:44px!important}
  #deck section [data-stack]>*{width:auto!important}
  #deck section > p[style*="bottom:64px"]{display:none}
  #deck section [style*="gap:56px"],#deck section [style*="gap:64px"],#deck section div[style*="justify-content:space-between;align-items:start"],#deck section div[style*="flex-direction:row;gap:28px"]{flex-direction:column!important;gap:18px!important}
  #deck section [style*="width:960px"],#deck section [style*="width:848px"],#deck section [style*="width:648px"],#deck section [style*="width:760px"],#deck section [style*="width:1100px"],#deck section [style*="width:1300px"],#deck section [style*="width:1500px"],#deck section [style*="width:1600px"],#deck section [style*="width:1664px"],#deck section [style*="width:1400px"]{width:auto!important;max-width:100%}
  #deck section img[style*="width:760px"],#deck section img[style*="width:370px"]{width:100%!important;height:auto!important;aspect-ratio:16/9;object-fit:cover}
  #deck section img[style*="width:700px"]{width:420px!important;height:auto!important}
  #deck section > [style*="grid-template-columns"],#deck section > div > [style*="grid-template-columns:1fr 1fr 1fr 1fr"],#deck section > div > [style*="grid-template-columns:1fr 1fr 1fr 1fr 1fr"],#deck section > div > [style*="grid-template-columns:1fr 1fr;gap:24px"]{grid-template-columns:1fr!important}
  #deck section h1{font-size:96px!important;width:auto!important}
  #deck section h2[style*="font-size:72px"],#deck section h2[style*="font-size:64px"]{font-size:52px!important}
  #deck section h2[style*="font-size:120px"]{font-size:72px!important}
  #deck section div[style*="width:470px"][style*="height:128px"]{width:auto!important;display:inline-flex!important;gap:14px!important;padding:10px 18px!important;margin-top:8px;align-self:flex-end}
  #deck section div[style*="width:470px"] svg{width:40px!important;height:62px!important;flex:none}
  #deck section div[style*="width:470px"] p[style*="font-size:42px"]{font-size:30px!important;letter-spacing:2px!important}
  #deck section div[style*="width:470px"] p[style*="letter-spacing:9px"]{font-size:16px!important;letter-spacing:6px!important}
  #deck section div[style*="display:flex;flex-direction:row;gap:20px"]{flex-direction:column!important}
  #deck section img{max-width:100%}
  #deck section table{font-size:22px!important}
  .tap,#hint{display:none}
  #bar{position:fixed}
  #hud{font-size:12px;background:rgba(42,10,15,.85);padding:6px 10px;border-radius:8px;bottom:10px;right:10px}
  #deck section p[style*="font-size:72px"][style*="letter-spacing:5px"]{font-size:44px!important;letter-spacing:3px!important}
  #deck section p[style*="letter-spacing:14px"]{font-size:20px!important;letter-spacing:8px!important}
  #deck section svg[style*="width:122px"]{width:74px!important;height:116px!important}
  #deck section #gate{display:none}
  #gate{position:fixed}
}

/* chrome */
#bar{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(237,214,194,.15)}
#bar i{display:block;height:100%;background:var(--rose);width:0;transition:width .3s}
#hud{position:fixed;right:16px;bottom:14px;color:var(--rose);font-size:13px;letter-spacing:2px;text-transform:uppercase;opacity:.8;user-select:none}
#hint{position:fixed;left:16px;bottom:14px;color:var(--rose);font-size:13px;letter-spacing:1px;opacity:.7;transition:opacity 1s}
#hint.hide{opacity:0}
.tap{position:fixed;top:0;bottom:40px;width:30%;cursor:pointer}
#prev{left:0}#next{right:0}
#notes{position:fixed;left:0;right:0;bottom:0;max-height:34vh;overflow:auto;background:#1A0509;color:#EDD6C2;padding:18px 28px;font-size:16px;line-height:1.55;border-top:1px solid #7A3A42;display:none}
body.presenter #notes{display:block}
body.presenter #stage{bottom:34vh}
@media (max-width:700px){#hint{display:none}}

/* animations: run when a slide becomes active */
.active [data-stagger]>*{animation:fadeUp .6s both;animation-delay:calc(.12s + var(--k,0)*.1s)}
.active [data-anim="rise"]{animation:fadeUp .7s both;animation-delay:calc(.2s + (var(--i,1) - 1)*.35s)}
.active [data-anim="stamp"]{animation:stamp .5s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(.4s + (var(--i,1) - 1)*.28s)}
.active [data-anim="glow"]{animation:glow .8s both;animation-delay:calc(1.4s + (var(--i,1) - 1)*.04s)}
.active [data-anim="glowtext"]{animation:glowtext 1.2s both;animation-delay:1.2s}
.active [data-anim="mark"]{animation:stamp .45s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(.5s + (var(--i,1) - 1)*.5s)}
.active [data-anim="late"]{animation:fadeUp .6s both;animation-delay:calc(2.4s + (var(--i,1) - 1)*.25s)}
.active [data-anim="bar"]{animation:grow 1.4s cubic-bezier(.2,.8,.2,1) both;animation-delay:.6s}
.active [data-anim="pulse"]{animation:pulse 1.6s ease-in-out 2.4s infinite}
.active [data-anim="drop"]{animation:drop .5s cubic-bezier(.2,1.2,.4,1) both;animation-delay:calc(.3s + (var(--i,1) - 1)*.18s)}
.active [data-anim="blink"]{animation:blink 1.2s ease-in-out infinite}
.active [data-anim="ring"]{animation:ring 2.4s ease-in-out infinite}
.active [data-anim="expose"]{animation:expose 3s ease-in-out .4s both}
.active [data-anim="expose"]>*{animation:fadeIn 1s both 1.6s}
.active [data-anim="bead"]{animation:bead 1.2s ease-in-out both;animation-delay:calc(.8s + (var(--i,1) - 1)*.07s)}
.active [data-anim="print"]{animation:print 1.6s cubic-bezier(.2,.8,.2,1) both .6s}
.active [data-anim="token"]{animation:stamp .5s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(1.2s + (var(--i,1) - 1)*.6s)}
.active [data-anim="darken"]{animation:darken 2s ease-in-out both .6s}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes stamp{from{opacity:0;transform:rotate(-14deg) scale(0)}60%{opacity:1;transform:rotate(-14deg) scale(1.25)}to{opacity:1;transform:rotate(-14deg) scale(1)}}
@keyframes glow{from{background:#6B2731;box-shadow:none}to{background:#CFFFB8;box-shadow:0 0 12px #8CFF5E}}
@keyframes glowtext{from{color:#5A2A36;text-shadow:none}to{color:#DDFFCC;text-shadow:0 0 18px #8CFF5E,0 0 36px #4CAF2A}}
@keyframes grow{from{width:0}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 10px rgba(200,16,46,.25)}50%{box-shadow:0 0 0 22px rgba(200,16,46,0)}}
@keyframes drop{from{opacity:0;transform:translateY(-30px) rotate(-3deg)}to{opacity:1}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
@keyframes ring{0%,100%{box-shadow:0 0 24px #FFE7C2}50%{box-shadow:0 0 48px #FFE7C2}}
@keyframes expose{from{background:#E9F0D9}to{background:#1E3F8A}}
@keyframes bead{from{background:#FFFFFF;border:2px solid #C9B6A6}}
@keyframes print{from{transform:translateY(-110%);opacity:0}to{transform:none;opacity:1}}
@keyframes darken{from{background:#8E7F86}to{background:#2A2126}}
@keyframes pathA{0%{transform:translate(226px,63px);opacity:0}3%{transform:translate(226px,63px);opacity:1}14%{transform:translate(111px,161px)}21%{transform:translate(111px,161px)}30%{transform:translate(341px,232px)}37%{transform:translate(341px,232px)}46%{transform:translate(608px,81px)}53%{transform:translate(608px,81px)}62%{transform:translate(638px,257px)}69%{transform:translate(638px,257px)}80%{transform:translate(226px,409px);opacity:1}90%{transform:translate(226px,409px);opacity:0}100%{transform:translate(226px,409px);opacity:0}}
@keyframes pathB{0%{transform:translate(226px,63px);opacity:0}3%{transform:translate(226px,63px);opacity:1}14%{transform:translate(341px,232px)}21%{transform:translate(341px,232px)}30%{transform:translate(844px,81px)}37%{transform:translate(844px,81px)}46%{transform:translate(874px,257px)}53%{transform:translate(874px,257px)}62%{transform:translate(111px,294px)}69%{transform:translate(111px,294px)}80%{transform:translate(226px,409px);opacity:1}90%{transform:translate(226px,409px);opacity:0}100%{transform:translate(226px,409px);opacity:0}}
@keyframes pathC{0%{transform:translate(226px,63px);opacity:0}3%{transform:translate(226px,63px);opacity:1}14%{transform:translate(608px,81px)}21%{transform:translate(608px,81px)}30%{transform:translate(638px,257px)}37%{transform:translate(638px,257px)}46%{transform:translate(111px,161px)}53%{transform:translate(111px,161px)}62%{transform:translate(111px,294px)}69%{transform:translate(111px,294px)}80%{transform:translate(226px,409px);opacity:1}90%{transform:translate(226px,409px);opacity:0}100%{transform:translate(226px,409px);opacity:0}}
@keyframes pathD{0%{transform:translate(226px,63px);opacity:0}3%{transform:translate(226px,63px);opacity:1}14%{transform:translate(844px,81px)}21%{transform:translate(844px,81px)}30%{transform:translate(874px,257px)}37%{transform:translate(874px,257px)}46%{transform:translate(341px,232px)}53%{transform:translate(341px,232px)}62%{transform:translate(111px,161px)}69%{transform:translate(111px,161px)}80%{transform:translate(226px,409px);opacity:1}90%{transform:translate(226px,409px);opacity:0}100%{transform:translate(226px,409px);opacity:0}}
[data-dot]{position:absolute;left:0;top:0;width:18px;height:18px;border-radius:50%;background:#C8102E;border:3px solid #FFFFFF;box-shadow:0 3px 8px rgba(74,20,28,.35);opacity:0;pointer-events:none}
.active [data-dot]{animation:pathA 15s ease-in-out infinite;animation-delay:var(--d)}
.active [data-dot="B"]{animation-name:pathB}.active [data-dot="C"]{animation-name:pathC}.active [data-dot="D"]{animation-name:pathD}
.active [data-anim="row"]{animation:rowIn .7s both,rowNow 12s ease-in-out infinite;animation-delay:calc(.3s + (var(--i,1) - 1)*.45s),calc(3s + (var(--i,1) - 1)*2s)}
@keyframes rowNow{0%{background:rgba(200,16,46,0)}4%{background:rgba(200,16,46,.55)}14%{background:rgba(200,16,46,.55)}18%{background:rgba(200,16,46,0)}100%{background:rgba(200,16,46,0)}}
.active [data-anim="station"]{animation:stationIn .5s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc(3.1s + (var(--i,1) - 1)*.16s)}
@keyframes rowIn{0%{opacity:0;transform:translateX(-24px);background:rgba(200,16,46,0)}60%{opacity:1;transform:none;background:rgba(200,16,46,.35)}100%{opacity:1;transform:none;background:rgba(200,16,46,0)}}
@keyframes stationIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){.active [data-anim],.active [data-stagger]>*{animation:none!important}}
</style>

function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function unlock(pw){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.salt),iterations:200000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.iv)},key,b64(ENC.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
(function(){
  var form=document.getElementById('gateform'), input=document.getElementById('pw'), err=document.getElementById('err'), gate=document.getElementById('gate');
  async function go(pw){ try{ var d=await unlock(pw); try{sessionStorage.setItem('kye',pw)}catch(e){}; gate.remove(); document.body.classList.add('open'); startDeck(d.slides,d.notes); }
    catch(e){ err.textContent='That password is not right.'; gate.classList.remove('shake'); void gate.offsetWidth; gate.classList.add('shake'); input.select(); } }
  form.addEventListener('submit',function(e){ e.preventDefault(); err.textContent=''; go(input.value.trim()); });
  var saved=null; try{saved=sessionStorage.getItem('kye')}catch(e){}
  if(saved){ go(saved); } else { input.focus(); }
})();
function startDeck(slidesHtml, NOTES){
  var deck=document.getElementById('deck'); deck.innerHTML=slidesHtml;
  var slides=[].slice.call(deck.querySelectorAll('section'));
  var n=slides.length, cur=-1, bar=document.querySelector('#bar i'), hud=document.getElementById('hud'), notes=document.getElementById('notes');
  if(/presenter/.test(location.search)) document.body.classList.add('presenter');
  slides.forEach(function(s){ s.querySelectorAll('[data-stagger]').forEach(function(g){ [].forEach.call(g.children,function(c,k){ c.style.setProperty('--k',k); }); });
    s.querySelectorAll('[data-i]').forEach(function(e){ e.style.setProperty('--i', e.getAttribute('data-i')); }); });
  function fit(){ var st=document.getElementById('stage'); var w=st.clientWidth, h=st.clientHeight; var sc=Math.min(w/1920,h/1080); deck.style.transform='scale('+sc+')'; }
  function show(i, push){ i=Math.max(0,Math.min(n-1,i)); if(i===cur) return;
    if(cur>=0){ slides[cur].classList.remove('active'); }
    cur=i; var s=slides[i]; s.classList.add('active');
    // restart animations
    s.querySelectorAll('[data-anim],[data-stagger]>*').forEach(function(e){ e.style.animation='none'; void e.offsetWidth; e.style.animation=''; });
    bar.style.width=((i+1)/n*100)+'%'; hud.textContent=(i+1)+' / '+n; notes.textContent=NOTES[i]||'';
    if(push!==false) history.replaceState(null,'','#'+(i+1));
  }
  function start(){ var h=parseInt(location.hash.slice(1),10); show(isNaN(h)?0:h-1,false); }
  document.getElementById('next').onclick=function(){show(cur+1)};
  document.getElementById('prev').onclick=function(){show(cur-1)};
  document.addEventListener('keydown',function(e){ if(document.body.classList.contains('mobile')) return;
    if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' '||e.key==='PageDown'||e.key==='Enter'){e.preventDefault();show(cur+1);}
    else if(e.key==='ArrowLeft'||e.key==='ArrowUp'||e.key==='PageUp'||e.key==='Backspace'){e.preventDefault();show(cur-1);}
    else if(e.key==='Home'){show(0)} else if(e.key==='End'){show(n-1)}
    else if(e.key==='f'||e.key==='F'){ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); }
    else if(e.key==='n'||e.key==='N'){ document.body.classList.toggle('presenter'); fit(); }
    document.getElementById('hint').classList.add('hide');
  });
  var tx=null; document.addEventListener('touchstart',function(e){tx=e.touches[0].clientX},{passive:true});
  document.addEventListener('touchend',function(e){ if(tx===null||document.body.classList.contains('mobile')) return; var dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>50) show(dx<0?cur+1:cur-1); tx=null; });
  window.addEventListener('resize',function(){ if(document.body.classList.contains('mobile')) zoomSlides(); else fit(); }); window.addEventListener('hashchange',start);
  var mq=window.matchMedia('(max-width:820px) and (orientation:portrait)');
  function zoomSlides(){ var z=document.documentElement.clientWidth/720; slides.forEach(function(s){ s.style.zoom=z; }); }
  function unzoom(){ slides.forEach(function(s){ s.style.zoom=''; }); }
  var io=null;
  function mobileMode(on){
    if(on){ document.body.classList.add('mobile'); slides.forEach(function(s){s.classList.remove('active')}); zoomSlides();
      io=new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('active'); var i=slides.indexOf(e.target); bar.style.width=((i+1)/n*100)+'%'; hud.textContent=(i+1)+' / '+n; } }); },{threshold:0.35});
      slides.forEach(function(s){io.observe(s)});
      var h=parseInt(location.hash.slice(1),10); if(!isNaN(h)&&slides[h-1]) slides[h-1].scrollIntoView();
    } else { document.body.classList.remove('mobile'); unzoom(); if(io){io.disconnect();io=null;} slides.forEach(function(s){s.classList.remove('active')}); var c=cur; cur=-1; fit(); show(c<0?0:c,false); }
  }
  if(mq.matches){ cur=0; mobileMode(true); } else { fit(); start(); }
  mq.addEventListener('change',function(e){ mobileMode(e.matches); });
  setTimeout(function(){document.getElementById('hint').classList.add('hide')},6000);
}
</script>
